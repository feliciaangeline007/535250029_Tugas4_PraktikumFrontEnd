<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background pastel mint-emerald -->
  <rect width="120" height="120" rx="32" fill="url(#bg_david)" />

  <!-- Decorative doodle elements -->
  <circle cx="100" cy="30" r="4" fill="#34D399" opacity="0.4"/>
  <rect x="18" y="24" width="6" height="6" rx="2" transform="rotate(25 18 24)" fill="#10B981" opacity="0.4"/>

  <!-- Body / Hoodie -->
  <path d="M26 120C26 96 40 86 60 86C80 86 94 96 94 120H26Z" fill="#047857"/>
  <path d="M54 86L60 96L66 86" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="53" y="72" width="14" height="18" rx="4" fill="#FCD34D"/>

  <!-- Head / Face -->
  <rect x="42" y="38" width="36" height="42" rx="18" fill="#FDE68A"/>

  <!-- Short Hair / Sideburns -->
  <path d="M38 52V46C38 36 46 28 60 28C74 28 82 36 82 46V52" fill="#1F2937"/>

  <!-- Designer Beanie (Yellow/Amber) -->
  <path d="M38 42C38 30 48 22 60 22C72 22 82 30 82 42H38Z" fill="#F59E0B"/>
  <rect x="36" y="39" width="48" height="8" rx="4" fill="#D97706"/>

  <!-- Eyes (Friendly dots with slight brow) -->
  <path d="M48 49C50 48 53 48 55 49" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M65 49C67 48 70 48 72 49" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="51.5" cy="54" r="2.5" fill="#1F2937"/>
  <circle cx="68.5" cy="54" r="2.5" fill="#1F2937"/>

  <!-- Nose -->
  <path d="M60 56V59" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M55 64C57 67 63 67 65 64" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Cheerful blush -->
  <circle cx="46" cy="60" r="3.5" fill="#F87171" opacity="0.3"/>
  <circle cx="74" cy="60" r="3.5" fill="#F87171" opacity="0.3"/>

  <defs>
    <linearGradient id="bg_david" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>
</svg>
