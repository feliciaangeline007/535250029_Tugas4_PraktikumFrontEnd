  <defs>
    <linearGradient id="bg_kevin" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
